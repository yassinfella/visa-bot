name: Visa Bot Monitor

on:
  schedule:
    - cron: '0 * * * *'  # يتم تشغيل الفحص تلقائياً كل ساعة
  workflow_dispatch:     # يتيح لك زر لتشغيله يدوياً متى شئت

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot script
        run: python main.pay.py
